<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1700 1100" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title description">
  <title id="title">Digital Financial Literacy Agent — IBM architecture blueprint</title>
  <desc id="description">Architecture diagram showing the user and Streamlit interface, IBM Bob for development, watsonx.ai embeddings and IBM Granite in IBM Cloud, local ChromaDB retrieval, and the document ingestion flow.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1L11 6L1 11Z" fill="#3267d5"/>
    </marker>
    <marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1L11 6L1 11Z" fill="#169b91"/>
    </marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1L11 6L1 11Z" fill="#9153bb"/>
    </marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1L11 6L1 11Z" fill="#e58a32"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #243248; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 14px; fill: #61728a; }
      .section { font-size: 13px; font-weight: 700; letter-spacing: 1.3px; }
      .box-title { font-size: 18px; font-weight: 700; }
      .body { font-size: 14px; fill: #53647b; }
      .small { font-size: 12px; fill: #64748b; }
      .tiny { font-size: 11px; fill: #64748b; }
      .tag { font-size: 11px; font-weight: 700; letter-spacing: .5px; }
      .arrow-label { font-size: 12px; fill: #56677d; }
      .panel { fill: #fff; stroke: #d7e0eb; stroke-width: 1.5; }
      .flow { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1700" height="1100" fill="#f3f6fa"/>
  <rect x="22" y="22" width="1656" height="1056" rx="20" fill="#fff" stroke="#1b2b42" stroke-width="3"/>

  <text x="60" y="76" class="title">Digital Financial Literacy Agent</text>
  <text x="60" y="105" class="subtitle">Target architecture · IBM Cloud · watsonx.ai · IBM Granite · IBM Bob</text>
  <rect x="1390" y="48" width="225" height="34" rx="17" fill="#e8efff"/>
  <text x="1502" y="70" text-anchor="middle" class="tag" fill="#2857ad">IBM-POWERED DESIGN</text>

  <!-- IBM Bob is a development tool, not part of live user requests. -->
  <rect x="65" y="132" width="300" height="86" rx="14" fill="#f6f1ff" stroke="#9870cb" stroke-width="2"/>
  <rect x="82" y="147" width="92" height="22" rx="11" fill="#eadfff"/>
  <text x="128" y="162" text-anchor="middle" class="tag" fill="#7047a3">DEVELOPMENT</text>
  <text x="84" y="192" class="box-title">IBM Bob</text>
  <text x="192" y="191" class="body">Builds and maintains the app</text>
  <path d="M365 176H402V274" class="flow" stroke="#9870cb" stroke-dasharray="7 7" marker-end="url(#arrow-purple)"/>
  <text x="412" y="219" class="arrow-label">developer workflow</text>

  <!-- Runtime boundary -->
  <rect x="48" y="250" width="1604" height="568" rx="22" fill="#fbfdff" stroke="#56b9b2" stroke-width="2.5" stroke-dasharray="10 8"/>
  <rect x="74" y="265" width="254" height="26" rx="13" fill="#e5f7f5"/>
  <text x="201" y="283" text-anchor="middle" class="section" fill="#197d76">USER &amp; RAG WORKFLOW</text>

  <!-- User -->
  <rect x="80" y="370" width="170" height="136" rx="18" class="panel"/>
  <circle cx="165" cy="409" r="20" fill="#e8f0ff"/>
  <circle cx="165" cy="402" r="7" fill="#3267d5"/>
  <path d="M151 423c2-12 26-12 28 0" fill="none" stroke="#3267d5" stroke-width="3" stroke-linecap="round"/>
  <text x="165" y="457" text-anchor="middle" class="box-title">User</text>
  <text x="165" y="480" text-anchor="middle" class="small">Ask in a preferred language</text>

  <!-- Streamlit app -->
  <rect x="310" y="345" width="260" height="184" rx="18" fill="#eef5ff" stroke="#7198df" stroke-width="2"/>
  <rect x="328" y="360" width="142" height="23" rx="11" fill="#dce8ff"/>
  <text x="399" y="376" text-anchor="middle" class="tag" fill="#315da8">USER INTERFACE</text>
  <text x="330" y="414" class="box-title">Streamlit App</text>
  <text x="330" y="442" class="body">• Chat and question input</text>
  <text x="330" y="466" class="body">• Six language choices</text>
  <text x="330" y="490" class="body">• PDF / TXT guide uploads</text>
  <text x="330" y="514" class="tiny">UPI · scams · loans · budgeting</text>

  <!-- IBM Cloud-hosted watsonx.ai service -->
  <rect x="625" y="315" width="306" height="250" rx="20" fill="#f8fbff" stroke="#4978dc" stroke-width="2.2" stroke-dasharray="8 6"/>
  <rect x="650" y="300" width="256" height="28" rx="14" fill="#e7efff"/>
  <text x="778" y="319" text-anchor="middle" class="section" fill="#315da8">IBM CLOUD · WATSONX.AI</text>
  <rect x="650" y="365" width="255" height="150" rx="16" fill="#f1f5ff" stroke="#6688df" stroke-width="2"/>
  <rect x="669" y="380" width="120" height="23" rx="11" fill="#dce8ff"/>
  <text x="729" y="396" text-anchor="middle" class="tag" fill="#315da8">EMBEDDINGS</text>
  <text x="670" y="435" class="box-title">watsonx.ai</text>
  <text x="670" y="462" class="body">Multilingual text embeddings</text>
  <text x="670" y="487" class="small">For questions and guide chunks</text>

  <!-- IBM Cloud-hosted IBM Granite service -->
  <rect x="1260" y="315" width="332" height="250" rx="20" fill="#fbf8ff" stroke="#7554bd" stroke-width="2.2" stroke-dasharray="8 6"/>
  <rect x="1282" y="300" width="288" height="28" rx="14" fill="#eee7ff"/>
  <text x="1426" y="319" text-anchor="middle" class="section" fill="#7047a3">IBM CLOUD · WATSONX.AI</text>
  <rect x="1282" y="365" width="292" height="150" rx="16" fill="#f5f1ff" stroke="#9370ca" stroke-width="2"/>
  <rect x="1301" y="380" width="113" height="23" rx="11" fill="#eadfff"/>
  <text x="1357" y="396" text-anchor="middle" class="tag" fill="#7047a3">GENERATION</text>
  <text x="1302" y="435" class="box-title">IBM Granite</text>
  <text x="1302" y="462" class="body">Conversational, grounded answers</text>
  <text x="1302" y="487" class="small">Responds in the selected language</text>

  <!-- Retrieval/vector store -->
  <rect x="962" y="365" width="260" height="150" rx="16" fill="#f3fbf9" stroke="#52a99d" stroke-width="2"/>
  <rect x="981" y="380" width="125" height="23" rx="11" fill="#def4ef"/>
  <text x="1043" y="396" text-anchor="middle" class="tag" fill="#197d76">LOCAL RAG LAYER</text>
  <text x="982" y="435" class="box-title">ChromaDB</text>
  <text x="982" y="462" class="body">Vector search by language</text>
  <text x="982" y="487" class="small">Context + source metadata</text>

  <!-- Runtime arrows -->
  <path d="M250 438H310" class="flow" stroke="#3267d5" marker-end="url(#arrow-blue)"/>
  <text x="280" y="424" text-anchor="middle" class="arrow-label">question</text>

  <path d="M570 420H650" class="flow" stroke="#3267d5" marker-end="url(#arrow-blue)"/>
  <text x="610" y="407" text-anchor="middle" class="arrow-label">embed query</text>

  <path d="M905 440H962" class="flow" stroke="#169b91" marker-end="url(#arrow-teal)"/>
  <text x="934" y="426" text-anchor="middle" class="arrow-label">vector</text>

  <path d="M1222 440H1282" class="flow" stroke="#169b91" marker-end="url(#arrow-teal)"/>
  <text x="1252" y="426" text-anchor="middle" class="arrow-label">context</text>

  <path d="M1428 515V552H440V529" class="flow" stroke="#9153bb" marker-end="url(#arrow-purple)"/>
  <rect x="825" y="537" width="205" height="26" rx="13" fill="#f3eefe"/>
  <text x="927" y="555" text-anchor="middle" class="arrow-label" fill="#7047a3">answer returns to chat</text>

  <!-- Ingestion workflow -->
  <text x="82" y="622" class="section" fill="#a26120">KNOWLEDGE INGESTION · ADMIN UPLOADS + BUILT-IN GUIDANCE</text>
  <rect x="70" y="642" width="1560" height="145" rx="18" fill="#fffaf4" stroke="#e9b46b" stroke-width="2"/>

  <rect x="95" y="674" width="232" height="82" rx="13" fill="#fff" stroke="#e0a455" stroke-width="1.7"/>
  <text x="115" y="704" class="box-title" font-size="16">Trusted Guides</text>
  <text x="115" y="729" class="small">Government · banks · education</text>
  <text x="115" y="747" class="tiny">PDF / TXT + built-in guidance</text>

  <rect x="390" y="674" width="220" height="82" rx="13" fill="#fff" stroke="#e0a455" stroke-width="1.7"/>
  <text x="410" y="704" class="box-title" font-size="16">Extract &amp; Clean</text>
  <text x="410" y="731" class="small">Text extraction · page cleanup</text>

  <rect x="675" y="674" width="220" height="82" rx="13" fill="#fff" stroke="#e0a455" stroke-width="1.7"/>
  <text x="695" y="704" class="box-title" font-size="16">Chunk Documents</text>
  <text x="695" y="731" class="small">Overlapping searchable passages</text>

  <rect x="1310" y="674" width="280" height="82" rx="13" fill="#f3fbf9" stroke="#52a99d" stroke-width="1.7"/>
  <text x="1330" y="704" class="box-title" font-size="16">ChromaDB Knowledge Base</text>
  <text x="1330" y="731" class="small">Vectors · language · source metadata</text>

  <path d="M327 715H390" class="flow" stroke="#e58a32" marker-end="url(#arrow-orange)"/>
  <path d="M610 715H675" class="flow" stroke="#e58a32" marker-end="url(#arrow-orange)"/>

  <!-- Uploaded chunks use the same embedding and vector-store components as retrieval. -->
  <path d="M895 715H940V606H777V515" class="flow" stroke="#e58a32" stroke-dasharray="7 6" marker-end="url(#arrow-orange)"/>
  <text x="920" y="597" text-anchor="end" class="tiny">embed guide chunks</text>
  <path d="M777 515V615H1450V674" class="flow" stroke="#169b91" stroke-dasharray="7 6" marker-end="url(#arrow-teal)"/>
  <text x="1244" y="607" text-anchor="middle" class="tiny">index vectors + metadata</text>

  <text x="72" y="846" class="small">IBM Bob supports application development; IBM Cloud hosts watsonx.ai embeddings and IBM Granite in the target design.</text>
  <text x="72" y="871" class="small">The local RAG layer retrieves trusted material first; IBM Granite uses that context to answer, avoiding unsupported financial claims.</text>

  <rect x="70" y="918" width="1560" height="94" rx="16" fill="#f4f7fb" stroke="#d7e0eb"/>
  <text x="96" y="952" class="section">END-TO-END FLOW</text>
  <text x="96" y="981" class="body">User question → watsonx.ai embeddings → ChromaDB retrieval → IBM Granite response → localized answer in the app</text>
  <text x="1604" y="1044" text-anchor="end" class="tiny">Architecture blueprint · IBM target design</text>
</svg>
